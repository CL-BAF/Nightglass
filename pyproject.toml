[build-system]
# PEP 639 SPDX license expression (`license = "MIT"`) needs setuptools>=77.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywatch"
version = "0.1.0"
description = "Planet-scale SSH honeypot scanner with AI confidence scoring"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX license expression (a plain string). setuptools>=77 turns this
# into the canonical `License-Expression: MIT` metadata, so we no longer need
# the deprecated `License :: OSI Approved :: MIT License` trove classifier.
license = "MIT"
authors = [{ name = "honeywatch" }]
keywords = ["ssh", "honeypot", "scanner", "security", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
# Core runtime is pure stdlib — no required dependencies.
dependencies = []

[project.optional-dependencies]
# Full-depth host-key probing (RFC 4253 negotiation via paramiko).
full = ["paramiko>=3.0"]
# C2 / web control plane (dashboard + worker WebSocket transport).
# nacl is optional — C2 encryption falls back to AES-256-GCM (via cryptography)
# when PyNaCl is not installed.
c2 = ["aiohttp>=3.8", "websockets>=12.0"]
c2-encrypt = ["aiohttp>=3.8", "websockets>=12.0", "cryptography>=41.0", "pynacl>=1.5"]
# Vault encryption for credential store at rest (AES-256-GCM per-row).
vault = ["cryptography>=41.0"]
# Full feature set: paramiko + vault + C2 with encryption.
full-vault = ["paramiko>=3.0", "cryptography>=41.0"]
# Development / test tooling.
dev = ["pytest>=7.0"]

[project.scripts]
honeywatch = "honeywatch.cli:main"

[tool.setuptools.packages.find]
include = ["honeywatch*"]

[tool.setuptools.package-data]
"honeywatch.data" = ["wordlists/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
