[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywatch"
version = "0.1.0"
description = "Planet-scale SSH honeypot scanner with AI confidence scoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "honeywatch" }]
keywords = ["ssh", "honeypot", "scanner", "security", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
# Core runtime is pure stdlib — no required dependencies.
dependencies = []

[project.optional-dependencies]
# Full-depth host-key probing (RFC 4253 negotiation via paramiko).
full = ["paramiko>=3.0"]
# C2 / web control plane (dashboard + worker WebSocket transport).
c2 = ["aiohttp>=3.8", "websockets>=12.0"]
# Development / test tooling.
dev = ["pytest>=7.0"]

[project.scripts]
honeywatch = "honeywatch.cli:main"

[tool.setuptools.packages.find]
include = ["honeywatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
